<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý sân cầu lông</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Giao diện chuẩn phong cách Vue của Docsify -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- Dark / Light Theme -->
  <link rel="stylesheet"
        href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
        title="docsify-darklight-theme"
        type="text/css">
  <link rel="icon" href="favicon.ico">
<meta name="description" content="Website giới thiệu sân cầu lông, lịch sân và đặt sân.">
</head>
<body>
  <div id="app">Đang tải dữ liệu hệ thống...</div>
  <script>
    window.$docsify = {
      name: 'Quản lý sân cầu lông',
      repo: '',
      loadSidebar: true, // Kích hoạt thanh menu danh mục bên trái
      subMaxLevel: 3,    // Tự động lấy tiêu đề trang đưa vào menu
      search: 'auto'     // Kích hoạt thanh tìm kiếm toàn trang
    }
  </script>
  <!-- Thư viện mã nguồn mở Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugin tìm kiếm thông minh -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <!-- Plugin zoom anh -->
   <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- Plugin Chế độ Dark mode / Theme -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
<!-- Plugin Copy code -->
<script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <!-- plugin Đếm số chữ & Thời gian đọc -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>
</body>
</html>
